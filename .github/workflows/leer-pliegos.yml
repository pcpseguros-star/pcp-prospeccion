name: Leer pliegos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "datos/pliegos_fuente.csv"
      - "prospeccion/leer_pliegos.py"

permissions:
  contents: write

concurrency:
  group: datos-repo
  cancel-in-progress: false

jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar lector de PDF
        run: pip install pypdf

      - name: Bajar pliegos y extraer clausulas de seguros
        run: python prospeccion/leer_pliegos.py

      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add datos/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Lectura de pliegos $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
