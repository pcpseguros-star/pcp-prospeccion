name: Enriquecimiento de contactos

on:
  # Corre solo despues de cada ingesta, para buscar las empresas nuevas
  workflow_run:
    workflows: ["Ingesta CABA"]
    types: [completed]
  # A mano, desde Actions, eligiendo cuantas empresas buscar
  workflow_dispatch:
    inputs:
      limite:
        description: "Cuantas empresas buscar (0 = todas las pendientes)"
        required: false
        default: "10"

permissions:
  contents: write

concurrency:
  group: datos-repo
  cancel-in-progress: false

jobs:
  enriquecer:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar web, mail y telefono
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python prospeccion/enriquecer.py --limite "${{ github.event.inputs.limite || '0' }}"

      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add datos/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Enriquecimiento de contactos $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
