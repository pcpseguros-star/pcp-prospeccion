name: Ingesta CABA

on:
  schedule:
    # Dias 1 y 16 de cada mes, 06:17 hora Argentina (09:17 UTC)
    - cron: "17 9 1,16 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "prospeccion/**"
      - ".github/workflows/ingesta-caba.yml"

permissions:
  contents: write

concurrency:
  group: ingesta-caba
  cancel-in-progress: false

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bajar y filtrar compras de la Ciudad
        run: python prospeccion/procesar_caba.py

      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add datos/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Ingesta CABA $(date -u +%Y-%m-%d)"
            git push
          fi
